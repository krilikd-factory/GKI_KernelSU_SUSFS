name: Bug report
description: A KRILIKD build fails to build, boot or behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste serial numbers, IMEI, account data or network identifiers.
        If the phone does not boot, flash your saved boot image first, then report.
  - type: input
    id: device
    attributes:
      label: Device and firmware
      placeholder: "e.g., OnePlus 15 (CPH2745), ColorOS 17.0, patch level 2026-03"
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Build run URL
      description: The Actions run that produced the kernel you flashed.
      placeholder: "https://github.com/krilikd-factory/KRILIKD-kernel/actions/runs/..."
    validations:
      required: true
  - type: input
    id: uname
    attributes:
      label: Kernel version string
      description: Output of `uname -r` after boot, or the AnyKernel3 file name if it did not boot.
      placeholder: "e.g., 6.12.69-android16-6-KRILIKD"
    validations:
      required: true
  - type: dropdown
    id: root
    attributes:
      label: Root implementation
      options: [KernelSU-Next, KernelSU, SukiSU Ultra, BakaSU, FinaSU, KowSU]
    validations:
      required: true
  - type: input
    id: manager
    attributes:
      label: Manager version
      placeholder: "e.g., v3.4.2 (33555)"
  - type: dropdown
    id: stage
    attributes:
      label: Where it fails
      options: [Build in Actions, Flashing, First boot, After boot, ASB integration]
    validations:
      required: true
  - type: input
    id: lastgood
    attributes:
      label: Last working build
      description: Run URL or `uname -r` of the last build that worked, if any.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Evidence
      description: |
        Attach what applies: the BuildInfo artifact or failing job log, `/data/adb/ksu/logs/dmesg.log`, `console-ramoops` after a failed boot, or an ASB `asbdiag` report.
