name: 'Build summary'
description: 'Write one structured KRILIKD BuildInfo report from final config, component pins, patch decisions and safety evidence'
inputs:
  job_status:
    description: 'Status of the parent job (success/cancelled/failure)'
    required: true
  file_name:
    description: 'Artifact base name from the extract-sublevel-file-name step'
    required: false
    default: ''
  kernel_version:
    required: true
  sublevel:
    required: true
  android_version:
    required: true
  os_patch_level:
    required: true
  variant:
    required: false
    default: 'Normal'
  page_size:
    required: false
    default: '4k'
  feature_set:
    required: false
    default: ''
  family:
    required: false
    default: ''
  nomount_commit:
    required: false
    default: ''
  susfs_commit:
    required: false
    default: ''
  droidspaces_commit:
    required: false
    default: ''
  kernel_patches_commit:
    required: false
    default: ''
  anykernel3_commit:
    required: false
    default: ''
outputs:
  summary_base:
    description: 'Base name of the written summary (/tmp/build-summary-<base>.md)'
    value: ${{ steps.summary.outputs.summary_base }}

runs:
  using: "composite"
  steps:
    - name: Consolidated Build Summary
      id: summary
      shell: bash
      run: |
        set -euo pipefail
        SUMMARY_BASE="${{ inputs.file_name }}"
        if [ -z "${SUMMARY_BASE}" ]; then
          SUMMARY_BASE="${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}"
          VARIANT="${{ inputs.variant }}"
          if [ -n "${VARIANT}" ] && [ "${VARIANT}" != "Normal" ]; then
            SUMMARY_BASE="${SUMMARY_BASE}-${VARIANT}"
          fi
          if [ "${{ inputs.page_size }}" = "16k" ]; then
            SUMMARY_BASE="${SUMMARY_BASE}-16k"
          fi
        fi
        SUMMARY_FILE="/tmp/build-summary-${SUMMARY_BASE}.md"
        echo "SUMMARY_BASE=${SUMMARY_BASE}" >> "$GITHUB_ENV"

        KERNEL_VER_STR=""
        for image in /home/runner/out/dist/Image /home/runner/out/Image; do
          if [ -f "$image" ]; then
            KERNEL_VER_STR=$(strings "$image" | grep -m1 "^Linux version " | sed 's/Linux version //' || true)
            break
          fi
        done
        SUSFS_VER="N/A"
        SUSFS_HEADER="${{ github.workspace }}/kernel/common/include/linux/susfs.h"
        if [ -f "$SUSFS_HEADER" ]; then
          SUSFS_VER=$(grep '#define SUSFS_VERSION' "$SUSFS_HEADER" | awk -F'"' '{print $2}' || true)
          SUSFS_VER="${SUSFS_VER:-N/A}"
        fi

        # The tracked renderer is executed from this checkout. Keeping it as a real
        # source file leaves room for the full evidence report below GitHub's per-run
        # expression limit and makes clean-unpack execution directly testable.
        python3 -I "${{ github.workspace }}/.github/scripts/build_summary.py" \
          --workspace "${{ github.workspace }}" \
          --output "$SUMMARY_FILE" \
          --job-status "${{ inputs.job_status }}" \
          --file-name "${SUMMARY_BASE}" \
          --kernel-version "${{ inputs.kernel_version }}" \
          --sublevel "${{ inputs.sublevel }}" \
          --android-version "${{ inputs.android_version }}" \
          --os-patch-level "${{ inputs.os_patch_level }}" \
          --variant "${{ inputs.variant }}" \
          --page-size "${{ inputs.page_size }}" \
          --feature-set "${{ inputs.feature_set }}" \
          --family "${{ inputs.family }}" \
          --version-string "$KERNEL_VER_STR" \
          --susfs-version "$SUSFS_VER" \
          --susfs-commit "${{ inputs.susfs_commit }}" \
          --nomount-commit "${{ inputs.nomount_commit }}" \
          --droidspaces-commit "${{ inputs.droidspaces_commit }}" \
          --kernel-patches-commit "${{ inputs.kernel_patches_commit }}" \
          --anykernel3-commit "${{ inputs.anykernel3_commit }}"
        # The run page gets the compact provenance/result block only. The complete
        # evidence report remains the BuildInfo artifact and is not truncated there.
        awk '/^### 🧱 Build identity/ { exit } { print }' "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
        echo "summary_base=${SUMMARY_BASE}" >> "$GITHUB_OUTPUT"
