name: 'Enable SUSFS Kernel Configs'
description: 'Enable SUSFS-related kernel configuration options'

runs:
  using: "composite"
  steps:
    - name: Enable SUSFS Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          # Keep =y: SUSFS v2.4.0 fs/susfs.c calls SUSFS_LOGI_RL() unguarded,
          # and that macro only exists when this option is on, so =n does not
          # compile. Silence the log at runtime instead: ksu_susfs enable_log 0
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y