name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
  page_size:
    description: 'ARM64 page size: 4k (default, unchanged behaviour) or 16k'
    required: false
    type: string
    default: '4k'
  allow_version_mismatch:
    description: 'Whether to force-load version-mismatched modules'
    required: false
    type: boolean
    default: false
  lto:
    description: 'full (Google GKI release setting) or thin. full falls back to thin when its build fails (typically out of memory on the runner).'
    required: false
    default: 'full'
  kmi_symbol_lists:
    description: 'Vendor symbol lists (gki/aarch64/symbols/<name>) whose CRCs must match stock. Empty = skip the guard.'
    required: false
    default: 'qcom oplus'
runs:
  using: composite
  steps:
    - name: Setup Kernel Configs
      if: false
      uses: ./.github/actions/set-kernel-config

    # - name: Provide host ld from repo prebuilts
    #   shell: bash
    #   run: |
    #     cd "${{ github.workspace }}/kernel"
    #     # build.sh REPLACES PATH with 4 repo dirs (build-tools/path,
    #     # prebuilt clang bin, prebuilts/gas, out/host_tools), so /usr/bin and
    #     # /usr/local/bin are invisible: apt binutils can NOT fix this. Instead,
    #     # symlink ld.lld as "ld" inside the prebuilt clang's own bin dir -- the
    #     # clang driver looks there first, no PATH needed.
    #     # Dynamic, not hardcoded: resolve CLANG_PREBUILT_BIN exactly the way
    #     # build.sh does -- source build.config.constants (CLANG_VERSION) then
    #     # the same BUILD_CONFIG the build uses (build.config.gki.aarch64 chain).
    #     # ("|| true": runner shell is -e -o pipefail; failures here must fall
    #     # through to the loud error below, not kill the step silently.)
    #     CLANG_BIN=""
    #     if [ -f "common/build.config.gki.aarch64" ]; then
    #       CLANG_BIN=$(ROOT_DIR="$PWD" KERNEL_DIR=common bash -c '[ -f common/build.config.constants ] && . common/build.config.constants; . common/build.config.gki.aarch64; echo "$CLANG_PREBUILT_BIN"' || true)
    #     fi
    #     if [ -n "$CLANG_BIN" ] && [ -d "$CLANG_BIN" ] && [ -f "$CLANG_BIN/ld.lld" ]; then
    #       echo "Build clang bin (from build.config chain): $CLANG_BIN"
    #       ln -sf "ld.lld" "$CLANG_BIN/ld"
    #       ls -la "$CLANG_BIN/ld"
    #     else
    #       echo "ERROR: could not resolve build clang (got: '$CLANG_BIN')" >&2
    #       echo "--- workspace/kernel:" >&2
    #       ls "${{ github.workspace }}/kernel"
    #       exit 1
    #     fi

    - name: 'Build Kernel'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        PAGE_SIZE="${{ inputs.page_size }}"
        sed -i 's/check_defconfig//' ./common/build.config.gki
        if [ -f "build/build.sh" ]; then
          if [ "$PAGE_SIZE" != "4k" ]; then
            echo "ERROR: page_size=${PAGE_SIZE} is only supported by the Kleaf (Bazel) build; this tree uses build/build.sh." >&2
            exit 1
          fi
          # Compiler caching was removed on purpose: the ccache save/restore keys
          # never matched (save omitted the -g<gen> suffix), so no leg ever
          # restored one and every build was cold anyway; the bazel cache bought
          # a handful of actions for a multi-GB restore/save. A build that can be
          # reproduced only when a cache happens to be warm is worse than a slow
          # build, so the tree now compiles with plain clang every time.
          BUILD_GKI_ARTIFACTS="" \
          BUILD_GKI_CERTIFICATION_TOOLS=0 \
          BUILD_SYSTEM_DLKM=0 \
          SKIP_VENDOR_BOOT=1 \
          SKIP_EXT_MODULES=1 \
          SKIP_CP_KERNEL_HDR=1 \
          OUT_DIR="/home/runner/out" \
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          build/build.sh -j"$(nproc)"
        else
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          PAGE_SIZE_FLAGS=()
          if [ "$PAGE_SIZE" = "16k" ]; then
            PAGE_SIZE_FLAGS+=(--page_size=16k)
          fi
          # 6.18 stopped declaring the per-file label //common:kernel_aarch64/Image
          # even though the macro still emits that file (verified with
          # `tools/bazel query` / `cquery --output=files` on the 6.18 tree:
          # the label errors out with "did you mean kernel_aarch64_images?",
          # cquery lists bazel-out/.../kernel_aarch64/Image). Build the macro
          # target there; the rest of this action already reads the image from
          # bazel-bin/common/kernel_aarch64/Image, which is unchanged.
          if [ "${{ inputs.version }}" = "android17-6.18" ]; then
            BAZEL_TARGETS=(//common:kernel_aarch64)
          else
            # vmlinux.symvers comes out of the same kernel_build action as the
            # Image; naming it just guarantees it is materialised for the KMI
            # CRC guard below.
            BAZEL_TARGETS=(//common:kernel_aarch64/Image //common:kernel_aarch64/vmlinux.symvers)
          fi
          # --config=fast pins ThinLTO; an explicit --lto after it overrides.
          # Full LTO is what Google ships for GKI; if it fails here (the usual
          # cause is the 4-core/16 GB runner running out of memory on the
          # single vmlinux link) retry with ThinLTO instead of failing the leg.
          LTO="${{ inputs.lto }}"; LTO="${LTO:-full}"
          kbuild() { # <lto|empty>  empty = exactly the old command (fast => thin)
            local LTO_FLAG=()
            [ -n "$1" ] && LTO_FLAG=(--lto="$1")
            tools/bazel build \
              --config=fast \
              "${LTO_FLAG[@]}" \
              "${PAGE_SIZE_FLAGS[@]}" \
              --disk_cache=/home/runner/.cache/bazel \
              "${BAZEL_TARGETS[@]}"
          }
          if [ "$LTO" = "full" ]; then
            echo "Memory before full-LTO build:"; free -h || true
            set +e
            kbuild full 2>&1 | tee /tmp/kbuild-full.log
            RC=${PIPESTATUS[0]}
            set -e
            if [ "$RC" -eq 0 ]; then
              USED_LTO=full
            elif grep -qE ': (fatal )?error: |undefined reference to|Error [0-9]+$' /tmp/kbuild-full.log \
                 && ! grep -qiE 'killed|out of memory|signal 9|ld\.lld: error: .*(memory|mmap)' /tmp/kbuild-full.log; then
              # A source/compile error fails the same way with ThinLTO; do not
              # spend another 10+ minutes proving it.
              echo "::error::Kernel build failed with a compile error (not an LTO/memory problem); see the errors above" >&2
              exit "$RC"
            else
              echo "::warning::Full LTO build failed without a compile error (usually OOM); retrying with ThinLTO (the previous default command)"
              free -h || true
              kbuild ""
              USED_LTO=thin
            fi
          else
            kbuild "$LTO"
            USED_LTO="$LTO"
          fi
          echo "KERNEL_LTO=$USED_LTO" >> "$GITHUB_ENV"
          echo "### Kernel LTO: $USED_LTO" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: 'Verify Page Size in Generated .config'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        PAGE_SIZE="${{ inputs.page_size }}"

        # Kleaf writes the resolved .config under the kernel_config rule output
        # dir; the legacy build.sh writes it into OUT_DIR. Locate it instead of
        # hardcoding a path that upstream may rename.
        CONFIG_FILE=""
        for candidate in \
          bazel-bin/common/kernel_aarch64_config/out_dir/.config \
          /home/runner/out/.config; do
          if [ -f "$candidate" ]; then CONFIG_FILE="$candidate"; break; fi
        done
        if [ -z "$CONFIG_FILE" ]; then
          CONFIG_FILE="$(find bazel-bin/common /home/runner/out -maxdepth 4 -name .config -type f 2>/dev/null | head -n1 || true)"
        fi
        if [ -z "$CONFIG_FILE" ]; then
          if [ "$PAGE_SIZE" != "16k" ]; then
            # 4k builds are unchanged from before this feature; a missing .config
            # is a gap in the check, not a reason to fail a working build.
            echo "WARNING: no .config found; skipping page-size verification for 4k."
            exit 0
          fi
          echo "ERROR: could not locate the generated .config; page size cannot be verified." >&2
          exit 1
        fi
        echo "Verifying page size using $CONFIG_FILE"
        grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES|^CONFIG_ARM64_PAGE_SHIFT' "$CONFIG_FILE" || true
        echo "--- LTO / AutoFDO in final .config ---"
        grep -E '^(# )?CONFIG_LTO_(NONE|CLANG|CLANG_THIN|CLANG_FULL)[= ]|^CONFIG_AUTOFDO_CLANG' "$CONFIG_FILE" || true

        # Susfs-presence probe on the built image: the fs/susfs.o objects leave
        # their log-format strings in .rodata; a zero count means susfs was
        # trimmed somewhere between config and link.
        for img in bazel-bin/common/kernel_aarch64/Image /home/runner/out/dist/Image; do
          if [ -f "$img" ]; then
            echo "susfs strings in $(basename "$img"): $(grep -ac susfs "$img" || true)"
            break
          fi
        done

        # Root/susfs config probe: the Kleaf config stage has been observed to
        # drop KSU configs in flavour builds; surface the block and fail loud
        # when the root implementation's configs went missing.
        echo "--- KSU config block from $CONFIG_FILE ---"
        grep -E '^#? ?CONFIG_KSU' "$CONFIG_FILE" || echo '(no CONFIG_KSU entries in final .config)'
        if [ "${ROOT_IMPLEMENTATION:-}" != '' ] && [ "${ROOT_IMPLEMENTATION:-}" != 'none' ]; then
          if ! grep -q '^CONFIG_KSU=y' "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_KSU missing from final .config (root: $ROOT_IMPLEMENTATION)" >&2
            exit 1
          fi
          if [ -n "${SUSFS_COMMIT:-}" ] && ! grep -q '^CONFIG_KSU_SUSFS=y' "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_KSU_SUSFS missing from final .config (root: $ROOT_IMPLEMENTATION, susfs ${SUSFS_COMMIT})" >&2
            exit 1
          fi
        fi

        if [ "$PAGE_SIZE" = "16k" ]; then
          want_on="CONFIG_ARM64_16K_PAGES=y"
          want_off="# CONFIG_ARM64_4K_PAGES is not set"
        else
          want_on="CONFIG_ARM64_4K_PAGES=y"
          want_off="# CONFIG_ARM64_16K_PAGES is not set"
        fi

        if ! grep -qx "$want_on" "$CONFIG_FILE"; then
          echo "ERROR: expected '$want_on' in $CONFIG_FILE" >&2
          grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES' "$CONFIG_FILE" >&2 || true
          exit 1
        fi
        if ! grep -qx "$want_off" "$CONFIG_FILE"; then
          echo "ERROR: expected '$want_off' in $CONFIG_FILE" >&2
          grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES' "$CONFIG_FILE" >&2 || true
          exit 1
        fi
        echo "Page size verified: ${PAGE_SIZE}"

    - name: 'KMI CRC guard (stock vendor modules must still load)'
      # A build whose KMI symbol CRCs drifted boots to the logo and hangs:
      # first-stage init cannot load the vendor display/storage modules.
      # Compare the built vmlinux.symvers against the tree's abi.stg for the
      # symbols the device's vendor modules import, and fail the leg instead
      # of shipping an unbootable zip. allow_version_mismatch=true (module
      # CRC bypass) turns the failure into a warning.
      if: inputs.kmi_symbol_lists != ''
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        STG=""
        for c in common/gki/aarch64/abi.stg common/android/abi_gki_aarch64.stg; do
          [ -f "$c" ] && { STG="$c"; break; }
        done
        SYMVERS=""
        for c in bazel-bin/common/kernel_aarch64/vmlinux.symvers /home/runner/out/vmlinux.symvers /home/runner/out/dist/vmlinux.symvers; do
          [ -f "$c" ] && { SYMVERS="$c"; break; }
        done
        # System.map tells vmlinux symbols from the GKI-module exports that
        # abi.stg also lists. It is an output of the same kernel_build action
        # as vmlinux.symvers; if it is somehow absent, derive it from vmlinux.
        OUTDIR="$(dirname "${SYMVERS:-.}")"
        SYSMAP="$OUTDIR/System.map"
        if [ ! -f "$SYSMAP" ] && [ -f "$OUTDIR/vmlinux" ]; then
          NM="$(ls -d prebuilts/clang/host/linux-x86/clang-*/bin/llvm-nm 2>/dev/null | sort -V | tail -n1 || true)"
          NM="${NM:-$(command -v llvm-nm || command -v nm || true)}"
          if [ -n "$NM" ]; then
            "$NM" -n "$OUTDIR/vmlinux" > /tmp/vmlinux.System.map 2>/dev/null && SYSMAP=/tmp/vmlinux.System.map
          fi
        fi
        [ -f "$SYSMAP" ] || SYSMAP=""
        if [ -z "$STG" ] || [ -z "$SYMVERS" ]; then
          echo "::warning::KMI CRC guard skipped (abi.stg: '${STG:-none}', vmlinux.symvers: '${SYMVERS:-none}')"
          exit 0
        fi
        LISTS=()
        for n in ${{ inputs.kmi_symbol_lists }}; do
          for d in common/gki/aarch64/symbols common/android; do
            f="$d/$n"; [ -f "$f" ] || f="$d/abi_gki_aarch64_$n"
            [ -f "$f" ] && { LISTS+=("$f"); break; }
          done
        done
        if [ "${#LISTS[@]}" -eq 0 ]; then
          echo "::warning::no vendor symbol lists found for '${{ inputs.kmi_symbol_lists }}'; checking every symbol in $STG"
        fi
        echo "abi: $STG"; echo "symvers: $SYMVERS"; echo "System.map: ${SYSMAP:-none}"; printf 'list: %s\n' "${LISTS[@]}"
        rc=0
        python3 -I "${{ github.workspace }}/.github/scripts/kmi_crc_guard.py" \
          --stg "$STG" --symvers "$SYMVERS" --lists "${LISTS[@]}" \
          ${SYSMAP:+--sysmap "$SYSMAP"} \
          --report "${{ github.workspace }}/kmi-crc-report.txt" || rc=$?
        if [ "$rc" -eq 0 ]; then
          echo "KMI CRCs match stock: vendor modules will load."
          exit 0
        fi
        if [ "${{ inputs.allow_version_mismatch }}" = "true" ]; then
          echo "::warning::KMI CRC drift detected, continuing because allow_version_mismatch=true"
          exit 0
        fi
        echo "::error::KMI CRC drift: stock vendor modules would be rejected and the device would hang on the boot logo. See the list above; the usual cause is a config that changes a core struct/enum (e.g. FANOTIFY)." >&2
        exit 1

    - name: 'Gather Build Artifacts'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
          echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
          cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi
        if [ -f "/home/runner/out/dist/Image" ]; then
          echo "Found Image at /home/runner/out/dist/Image"
          cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi

        exit 1
