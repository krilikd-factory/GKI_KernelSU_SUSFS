name: 'Apply Performance Patches'
description: 'Apply experimental kernel patches with version-specific logic'
inputs:
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  kernel_family:
    description: 'GKI family used for patch target filtering'
    required: true
  patch_channel:
    description: 'stable applies enabled patches; candidate may also apply reviewed candidates'
    required: false
    default: 'stable'
  device:
    description: 'Device model used for patch target filtering'
    required: false
    default: ''
  soc:
    description: 'SoC used for patch target filtering'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Apply Experimental Patches
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        KERNEL_VERSION="${{ inputs.kernel_version }}"
        MIN_VERSION="5.16"
        KP="${{ github.workspace }}/kernel_patches/common"
        CHANNEL="${{ inputs.patch_channel }}"
        case "$CHANNEL" in stable|candidate) ;; *) echo "ERROR: invalid patch channel '$CHANNEL'" >&2; exit 1 ;; esac
        POWER_AUDIT="${{ github.workspace }}/performance-patch-audit.json"
        KP_COMMIT="$(git -C "${{ github.workspace }}/kernel_patches" rev-parse HEAD)"
        POWER_POLICY_TSV="$(mktemp)"
        python3 -I "${{ github.workspace }}/.github/scripts/performance_patch_policy.py" \
          --policy "${{ github.workspace }}/.github/performance-patch-policy.json" \
          --channel "$CHANNEL" --source-commit "$KP_COMMIT" --format json --output "$POWER_AUDIT"
        python3 -I "${{ github.workspace }}/.github/scripts/performance_patch_policy.py" \
          --policy "${{ github.workspace }}/.github/performance-patch-policy.json" \
          --channel "$CHANNEL" --source-commit "$KP_COMMIT" --format tsv > "$POWER_POLICY_TSV"

        # Every patch is dry-run first and only applied when it fits the tree.
        # A patch that does not apply (already merged upstream, context drift on
        # a newer sublevel) is skipped with a warning instead of killing the
        # build, so Performance can stay on by default. A *partial* apply is
        # impossible: the real run only happens after a clean dry run.
        APPLIED=(); SKIPPED=(); POWER_HELD=()
        try_patch() { # <name> [patch args...] < patch-on-stdin
          local name="$1"; shift
          local tmp; tmp="$(mktemp)"; cat > "$tmp"
          if patch -p1 --forward --dry-run "$@" < "$tmp" >/dev/null 2>&1; then
            patch -p1 --forward "$@" < "$tmp" >/dev/null
            APPLIED+=("$name")
          else
            SKIPPED+=("$name")
            echo "::warning::Performance: $name does not apply to this tree, skipped"
          fi
          rm -f "$tmp"
        }

        # KRILIKD TOP: one mode, every patch that fits this tree. Each one is
        # dry-run first, and the stock-config + KMI CRC guards after the build
        # stop anything that would change what the vendor modules rely on.
        apply_patch() { try_patch "$@"; }
        apply_reviewed_patch() { # <policy name> [patch args...] < patch-on-stdin
          local name="$1"; shift
          local decision
          decision="$(awk -F '\t' -v patch="$name" '$1 == patch { print $2 }' "$POWER_POLICY_TSV")"
          case "$decision" in
            apply) apply_patch "$name" "$@" ;;
            candidate_only)
              POWER_HELD+=("$name")
              echo "::notice::Performance: $name held back in stable; candidate-only functional/power trade-off"
              ;;
            *) echo "ERROR: $name has no valid reviewed power policy decision" >&2; exit 1 ;;
          esac
        }

        apply_reviewed_patch optimized_mem_operations < "$KP/optimized_mem_operations.patch"
        # file_struct_8bytes_align is deliberately NOT applied on GKI (>= 5.10
        # trees with ANDROID_KABI in struct file): on arm64 struct file already
        # has 8-byte alignment from its pointer/u64 members, so the patch buys
        # nothing, while editing the declaration risks a modversions CRC change
        # on every symbol that reaches struct file - the stock vendor modules
        # would then refuse to load (boot-logo hang).
        if ! grep -q 'ANDROID_KABI' include/linux/fs.h 2>/dev/null; then
          apply_patch file_struct_8bytes_align < "$KP/file_struct_8bytes_align.patch"
        else
          echo "file_struct_8bytes_align: skipped on GKI (KMI-sensitive, no-op on arm64)"
        fi
        apply_reviewed_patch reduce_cache_pressure < "$KP/reduce_cache_pressure.patch"
        apply_reviewed_patch mem_opt_prefetch < "$KP/mem_opt_prefetch.patch"

        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          apply_reviewed_patch optimise_memcmp < "$KP/optimise_memcmp.patch"
        elif [ "$(printf '%s\n' "$KERNEL_VERSION" "5.11" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          # process substitution, not a pipe: try_patch must run in this shell
          # so its APPLIED/SKIPPED bookkeeping survives.
          apply_reviewed_patch optimise_memcmp < <(sed \
              -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' \
              -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' \
              -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' \
              "$KP/optimise_memcmp.patch")
        else
          echo "Optimised memcmp patch not found!"
        fi
        apply_reviewed_patch minimise_wakeup_time < "$KP/minimise_wakeup_time.patch"
        apply_reviewed_patch int_sqrt < "$KP/int_sqrt.patch"
        apply_reviewed_patch reduce_gc_thread_sleep_time < "$KP/reduce_gc_thread_sleep_time.patch"
        apply_reviewed_patch add_timeout_wakelocks_globally < "$KP/add_timeout_wakelocks_globally.patch"
        apply_reviewed_patch f2fs_reduce_congestion < "$KP/f2fs_reduce_congestion.patch"
        apply_reviewed_patch reduce_freeze_timeout < "$KP/reduce_freeze_timeout.patch"

        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          apply_reviewed_patch clear_page_16bytes_align < "$KP/clear_page_16bytes_align.patch"
        else
          apply_reviewed_patch clear_page_16bytes_align -F3 < <(sed \
            -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' \
            "$KP/clear_page_16bytes_align.patch")
        fi

        # avoid_extra_s2idle_wake_attempts expects suspend_abort_fs_sync() to be
        # gone from pm_system_wakeup(); drop it first when present.
        FILE="drivers/base/power/wakeup.c"
        if grep -q "^void pm_system_wakeup(void)" "$FILE" && \
           sed -n '/^void pm_system_wakeup(void)/,/^}/p' "$FILE" | grep -q 'suspend_abort_fs_sync();'; then
          sed -i '/^void pm_system_wakeup(void)/,/^}/{
              /suspend_abort_fs_sync();/d
          }' "$FILE"
        fi
        for p in avoid_extra_s2idle_wake_attempts disable_cache_hot_buddy \
                 f2fs_enlarge_min_fsync_blocks increase_ext4_default_commit_age \
                 increase_sk_mem_packets reduce_pci_pme_wakeups \
                 silence_irq_cpu_logspam silence_system_logspam; do
          apply_reviewed_patch "$p" -F3 < "$KP/$p.patch"
        done

        # New upstream patches are observed by default. Stable builds apply only
        # human-reviewed "enabled" entries; an explicit candidate build may also
        # apply reviewed "candidate" entries for the exact family/device/SoC.
        # The JSON inventory is uploaded with BuildInfo and records content IDs,
        # policy state, target scope and every apply/hold decision.
        INVENTORY="${{ github.workspace }}/patch-inventory.json"
        TSV="$(mktemp)"
        python3 -I "${{ github.workspace }}/.github/scripts/new_patches.py" \
          --patches "$KP" --repo-root "${{ github.workspace }}" \
          --channel "$CHANNEL" --family "${{ inputs.kernel_family }}" \
          --device "${{ inputs.device }}" --soc "${{ inputs.soc }}" \
          --format json --output "$INVENTORY"
        python3 -I "${{ github.workspace }}/.github/scripts/new_patches.py" \
          --patches "$KP" --repo-root "${{ github.workspace }}" \
          --channel "$CHANNEL" --family "${{ inputs.kernel_family }}" \
          --device "${{ inputs.device }}" --soc "${{ inputs.soc }}" --format tsv > "$TSV"
        NEW_APPLIED=(); NEW_HELD=()
        while IFS=$'\t' read -r verdict name state why digest; do
          [ -n "${verdict:-}" ] || continue
          if [ "$verdict" = "APPLY" ]; then
            before=${#APPLIED[@]}
            # Candidate/enabled patches still require exact context and dry-run.
            try_patch "$name" -F0 < "$KP/$name.patch"
            [ "${#APPLIED[@]}" -gt "$before" ] && NEW_APPLIED+=("$name")
          else
            NEW_HELD+=("$name:$state")
            echo "new-patch held back: $name [$state] ($why) sha256=$digest"
          fi
        done < "$TSV"
        rm -f "$TSV" "$POWER_POLICY_TSV"
        [ "${#NEW_APPLIED[@]}" -eq 0 ] || echo "::notice::Reviewed $CHANNEL patches applied: ${NEW_APPLIED[*]}"

        # Google's GKI AutoFDO profile (Kleaf trees only): build the
        # kernel_aarch64 target with the profile Google ships in-tree but
        # only wires into kernel_aarch64_autofdo.
        AFDO_MSG="n/a (no BUILD.bazel)"
        if [ -f BUILD.bazel ]; then
          AFDO_MSG="$(python3 -I "${{ github.workspace }}/.github/scripts/gki_enable_autofdo.py")"
          echo "$AFDO_MSG"
        fi

        echo "[+] Performance: applied ${#APPLIED[@]}: ${APPLIED[*]:-none}"
        echo "[!] Performance: skipped ${#SKIPPED[@]}: ${SKIPPED[*]:-none}"
        # Preserve the main Performance pass for BuildInfo too. Previously it
        # existed only in the job page while reviewed patches lived in JSON, so
        # the downloaded report could not reconstruct the complete patch story.
        {
          echo "- applied (${#APPLIED[@]}): ${APPLIED[*]:-none}"
          echo "- skipped (${#SKIPPED[@]}): ${SKIPPED[*]:-none}"
          echo "- patch channel: ${CHANNEL}"
          echo "- stable channel held for functional/power review (${#POWER_HELD[@]}): ${POWER_HELD[*]:-none}"
          echo "- main patch power audit: performance-patch-audit.json (BuildInfo artifact; all 19 mechanisms and trade-offs)"
          echo "- reviewed new patches applied (${#NEW_APPLIED[@]}): ${NEW_APPLIED[*]:-none}"
          echo "- observed/held patches (${#NEW_HELD[@]}): ${NEW_HELD[*]:-none}"
          echo "- inventory: patch-inventory.json (BuildInfo artifact)"
          echo "- ${AFDO_MSG}"
        } > /tmp/performance-patches-summary.md
        {
          echo "### KRILIKD Performance patches (TOP)"
          cat /tmp/performance-patches-summary.md
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Power/perf defaults that do not touch the KMI
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          # Workqueues flagged power-efficient run unbound: the scheduler puts
          # the work on a CPU that is already awake instead of waking the one
          # that queued it. Fewer idle exits; same as workqueue.power_efficient=1.
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
          # KFENCE (sampling heap-bug detector) stays compiled in, but is off
          # unless booted with kfence.sample_interval=N: no 500 ms sampling
          # timer and no guarded allocations in normal use.
          CONFIG_KFENCE_SAMPLE_INTERVAL=0
