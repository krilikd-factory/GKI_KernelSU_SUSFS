name: 'Apply Performance Patches'
description: 'Apply experimental kernel patches with version-specific logic'
inputs:
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  performance_profile:
    description: 'KRILIKD profile: safe, balanced, or lab'
    required: false
    default: balanced

runs:
  using: 'composite'
  steps:
    - name: Apply Experimental Patches
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        KERNEL_VERSION="${{ inputs.kernel_version }}"
        PROFILE="${{ inputs.performance_profile }}"
        case "$PROFILE" in
          safe|balanced|lab) ;;
          *) echo "ERROR: unknown KRILIKD performance profile: $PROFILE" >&2; exit 2 ;;
        esac
        MIN_VERSION="5.16"
        KP="${{ github.workspace }}/kernel_patches/common"

        # Every patch is dry-run first and only applied when it fits the tree.
        # A patch that does not apply (already merged upstream, context drift on
        # a newer sublevel) is skipped with a warning instead of killing the
        # build, so Performance can stay on by default. A *partial* apply is
        # impossible: the real run only happens after a clean dry run.
        APPLIED=(); SKIPPED=()
        try_patch() { # <name> [patch args...] < patch-on-stdin
          local name="$1"; shift
          local tmp; tmp="$(mktemp)"; cat > "$tmp"
          if patch -p1 --forward --dry-run "$@" < "$tmp" >/dev/null 2>&1; then
            patch -p1 --forward "$@" < "$tmp" >/dev/null
            APPLIED+=("$name")
          else
            SKIPPED+=("$name")
            echo "::warning::Performance: $name does not apply to this tree, skipped"
          fi
          rm -f "$tmp"
        }

        # Safe is intentionally small. Balanced is the recommended daily
        # profile; lab is opt-in and may change writeback/wakeup behaviour.
        # Every selected patch still goes through the dry-run gate below.
        apply_patch() {
          local name="$1"; shift
          case "$PROFILE:$name" in
            safe:reduce_cache_pressure|safe:add_timeout_wakelocks_globally|safe:f2fs_reduce_congestion|safe:reduce_freeze_timeout|safe:avoid_extra_s2idle_wake_attempts|safe:disable_cache_hot_buddy|safe:f2fs_enlarge_min_fsync_blocks|safe:increase_ext4_default_commit_age|safe:increase_sk_mem_packets|safe:reduce_pci_pme_wakeups)
              SKIPPED+=("$name(profile)"); echo "KRILIKD $PROFILE: skipped $name"; return 0 ;;
            balanced:add_timeout_wakelocks_globally|balanced:reduce_freeze_timeout|balanced:avoid_extra_s2idle_wake_attempts|balanced:disable_cache_hot_buddy|balanced:f2fs_enlarge_min_fsync_blocks|balanced:increase_ext4_default_commit_age|balanced:increase_sk_mem_packets)
              SKIPPED+=("$name(profile)"); echo "KRILIKD $PROFILE: skipped $name"; return 0 ;;
            *) try_patch "$name" "$@" ;;
          esac
        }

        apply_patch optimized_mem_operations < "$KP/optimized_mem_operations.patch"
        # file_struct_8bytes_align is deliberately NOT applied on GKI (>= 5.10
        # trees with ANDROID_KABI in struct file): on arm64 struct file already
        # has 8-byte alignment from its pointer/u64 members, so the patch buys
        # nothing, while editing the declaration risks a modversions CRC change
        # on every symbol that reaches struct file - the stock vendor modules
        # would then refuse to load (boot-logo hang).
        if ! grep -q 'ANDROID_KABI' include/linux/fs.h 2>/dev/null; then
          apply_patch file_struct_8bytes_align < "$KP/file_struct_8bytes_align.patch"
        else
          echo "file_struct_8bytes_align: skipped on GKI (KMI-sensitive, no-op on arm64)"
        fi
        apply_patch reduce_cache_pressure < "$KP/reduce_cache_pressure.patch"
        apply_patch mem_opt_prefetch < "$KP/mem_opt_prefetch.patch"

        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          apply_patch optimise_memcmp < "$KP/optimise_memcmp.patch"
        elif [ "$(printf '%s\n' "$KERNEL_VERSION" "5.11" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          # process substitution, not a pipe: try_patch must run in this shell
          # so its APPLIED/SKIPPED bookkeeping survives.
          apply_patch optimise_memcmp < <(sed \
              -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' \
              -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' \
              -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' \
              "$KP/optimise_memcmp.patch")
        else
          echo "Optimised memcmp patch not found!"
        fi
        apply_patch minimise_wakeup_time < "$KP/minimise_wakeup_time.patch"
        apply_patch int_sqrt < "$KP/int_sqrt.patch"
        apply_patch reduce_gc_thread_sleep_time < "$KP/reduce_gc_thread_sleep_time.patch"
        apply_patch add_timeout_wakelocks_globally < "$KP/add_timeout_wakelocks_globally.patch"
        apply_patch f2fs_reduce_congestion < "$KP/f2fs_reduce_congestion.patch"
        apply_patch reduce_freeze_timeout < "$KP/reduce_freeze_timeout.patch"

        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          apply_patch clear_page_16bytes_align < "$KP/clear_page_16bytes_align.patch"
        else
          apply_patch clear_page_16bytes_align -F3 < <(sed \
            -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' \
            "$KP/clear_page_16bytes_align.patch")
        fi

        # avoid_extra_s2idle_wake_attempts expects suspend_abort_fs_sync() to be
        # gone from pm_system_wakeup(); drop it first when present.
        FILE="drivers/base/power/wakeup.c"
        if grep -q "^void pm_system_wakeup(void)" "$FILE" && \
           sed -n '/^void pm_system_wakeup(void)/,/^}/p' "$FILE" | grep -q 'suspend_abort_fs_sync();'; then
          sed -i '/^void pm_system_wakeup(void)/,/^}/{
              /suspend_abort_fs_sync();/d
          }' "$FILE"
        fi
        for p in avoid_extra_s2idle_wake_attempts disable_cache_hot_buddy \
                 f2fs_enlarge_min_fsync_blocks increase_ext4_default_commit_age \
                 increase_sk_mem_packets reduce_pci_pme_wakeups \
                 silence_irq_cpu_logspam silence_system_logspam; do
          apply_patch "$p" -F3 < "$KP/$p.patch"
        done

        # Google's GKI AutoFDO profile (Kleaf trees only): build the
        # kernel_aarch64 target with the profile Google ships in-tree but
        # only wires into kernel_aarch64_autofdo.
        AFDO_MSG="n/a (no BUILD.bazel)"
        if [ -f BUILD.bazel ]; then
          AFDO_MSG="$(python3 -I "${{ github.workspace }}/.github/scripts/gki_enable_autofdo.py")"
          echo "$AFDO_MSG"
        fi

        echo "[+] Performance: applied ${#APPLIED[@]}: ${APPLIED[*]:-none}"
        echo "[!] Performance: skipped ${#SKIPPED[@]}: ${SKIPPED[*]:-none}"
        {
          echo "### KRILIKD Performance patches"
          echo "- profile: ${PROFILE}"
          echo "- applied (${#APPLIED[@]}): ${APPLIED[*]:-none}"
          echo "- skipped (${#SKIPPED[@]}): ${SKIPPED[*]:-none}"
          echo "- ${AFDO_MSG}"
        } >> "$GITHUB_STEP_SUMMARY"
