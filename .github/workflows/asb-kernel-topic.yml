name: KRILIKD · ASB group build

on:
  workflow_dispatch:
    inputs:
      publish_telegram:
        description: "Publish all kernel files and common modules in the group"
        type: boolean
        default: true
        required: true
      root_flavor:
        description: 'Root implementation (all builds 18 kernels)'
        type: choice
        options:
          - KernelSU-Next
          - KernelSU
          - BakaSU
          - SukiSU-Ultra
          - KowSU
          - FinaSU
          - No Root
          - All root managers
        default: KernelSU-Next
        required: true
      disable_features:
        description: 'Comma-separated: susfs,nomount,bbg,net,ds,ntsync,ptrace,unicode,bpf,vpnhide,usb'
        type: string
        required: false
        default: ''
      perf_mode:
        description: '6.12: performance / BORE / BORE + ADIOS / none'
        type: choice
        options: ['true', bore, bore_adios, 'false']
        default: bore_adios
        required: true
      power_features:
        description: '6.12: Re-Kernel / ASB wakeup blocker / SDP900'
        type: choice
        options: [all, both, rekernel, wakeup-blocker, sdp-900ma, none]
        default: all
        required: true
      page_size_61:
        description: "OnePlus 12 · kernel page size"
        type: choice
        options: [4k, 16k]
        default: 4k
        required: true
      page_size_66:
        description: "Ace 6 · kernel page size"
        type: choice
        options: [4k, 16k]
        default: 4k
        required: true
      page_size_612:
        description: "OnePlus 15/15R · kernel page size"
        type: choice
        options: [4k, 16k]
        default: 4k
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: asb-group-kernel-build
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - name: Require supported page size
        env:
          PAGE_61: ${{ inputs.page_size_61 }}
          PAGE_66: ${{ inputs.page_size_66 }}
          PAGE_612: ${{ inputs.page_size_612 }}
        run: |
          if [ "$PAGE_61" != 4k ] || [ "$PAGE_66" != 4k ] || [ "$PAGE_612" != 4k ]; then
            echo "::error::This group build supports 4k only. No kernel build was started."
            exit 1
          fi
      - name: Prepare device and root matrix
        id: matrix
        env:
          ASB_ROOT_SELECTION: ${{ inputs.root_flavor }}
          ASB_DISABLED_FEATURES: ${{ inputs.disable_features }}
          ASB_PERF_MODE: ${{ inputs.perf_mode }}
          ASB_POWER_FEATURES: ${{ inputs.power_features }}
        run: python3 .github/scripts/asb_group_build.py matrix >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch matching build and publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.KRILIKD_TG_TOKEN }}
          TG_CHAT: "@AutoSystemBoost"
          TG_TOPIC: ${{ secrets.ASB_KERNEL_TOPIC_ID }}
          ASB_TARGET: ${{ matrix.target }}
          ASB_PAGE_SIZE: "4k"
          ASB_ROOT_FLAVOR: ${{ matrix.root_flavor }}
          ASB_DISABLED_FEATURES: ${{ inputs.disable_features }}
          ASB_PERF_MODE: ${{ inputs.perf_mode }}
          ASB_POWER_FEATURES: ${{ inputs.power_features }}
          ASB_DEFER_PUBLISH: "1"
        run: python3 -I .github/scripts/asb_group_build.py
      - uses: actions/upload-artifact@v7
        with:
          name: asb-build-reference-${{ matrix.id }}-${{ matrix.root_id }}
          path: asb-build-reference.json
          if-no-files-found: error

  publish:
    needs: build-and-publish
    if: ${{ inputs.publish_telegram }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: asb-build-reference-*
          path: build-references
      - name: Publish one group of files
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.KRILIKD_TG_TOKEN }}
          TG_CHAT: "@AutoSystemBoost"
          TG_TOPIC: ${{ secrets.ASB_KERNEL_TOPIC_ID }}
        run: python3 -I .github/scripts/asb_group_build.py publish-group
