name: Mark build as known-good

# Run this AFTER a stable build booted and every device checklist item passed.
# Candidate builds and build-only success are deliberately not enough.
# It copies that run's component pins (the *-Pins artifact every successful
# build leg uploads: KernelSU-Next, SUSFS, kernel/common, NoMount, BBG,
# DroidSpaces, kernel_patches, AnyKernel3 commits) into
# .github/known-good.json. "Build Kernels" with commit_mode=known-good
# (the default) then rebuilds exactly those commits. The set it replaces is
# kept as "<key>@previous" so a bad mark can be rolled back by hand.

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID or run URL of the Build Kernels run whose kernel BOOTED"
        required: true
        type: string
      build:
        description: "Only this build of the run (e.g. 6.12.69-android16-2026-03-KernelSU-Next); empty = every build in the run"
        required: false
        type: string
        default: ""
      device_validation:
        description: "Completed device-validation-template.json from the Pins artifact (or an array for several builds); every check must be passed"
        required: true
        type: string

concurrency:
  group: known-good
  cancel-in-progress: false

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the run's component pins
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE_VALIDATION: ${{ inputs.device_validation }}
          RUN_IN: ${{ inputs.run_id }}
          BUILD_IN: ${{ inputs.build }}
        run: |
          set -euo pipefail
          RUN="${RUN_IN##*/runs/}"; RUN="${RUN%%/*}"; RUN="${RUN%%\?*}"
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo "ERROR: '$RUN_IN' is not a run id or run URL" >&2; exit 1; }
          CONCL="$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json conclusion,workflowName --jq '.workflowName + " / " + (.conclusion // "in progress")')"
          echo "Run $RUN: $CONCL"
          [[ "$CONCL" == *" / success" ]] || { echo "ERROR: only a successful build run can become known-good" >&2; exit 1; }
          PATTERN="*-Pins"
          [ -n "$BUILD_IN" ] && PATTERN="${BUILD_IN}-Pins"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir pins
          shopt -s nullglob
          FILES=(pins/*/known-good-candidate.json)
          [ "${#FILES[@]}" -gt 0 ] || { echo "ERROR: run $RUN has no '$PATTERN' artifact (built before pin recording existed, or expired)" >&2; exit 1; }
          printf 'pins: %s\n' "${FILES[@]}"
          # Candidate channels are intentionally not promotable: enable the
          # reviewed patches in patch-policy.json, make a stable rebuild, then
          # validate that exact artifact on the device.
          for f in "${FILES[@]}"; do
            jq -e 'to_entries[0].value | .patch_channel == "stable"
                   and (.patch_inventory_sha256|test("^[0-9a-f]{64}$"))
                   and (.source_provenance_sha256|test("^[0-9a-f]{64}$"))
                   and (.capabilities_sha256|test("^[0-9a-f]{64}$"))' "$f" >/dev/null \
              || { echo "ERROR: $f is a candidate or lacks build evidence; refusing known-good" >&2; exit 1; }
          done
          # Every recorded set must carry real commits for the parts that decide
          # whether it boots; refuse to mark a half-empty set as known-good.
          for f in "${FILES[@]}"; do
            jq -e 'to_entries[0].value
                   | (.root_commit|test("^[0-9a-f]{40}$"))
                     and (.kernel_source_commit|test("^[0-9a-f]{40}$"))' "$f" >/dev/null \
              || { echo "ERROR: $f lacks root_commit/kernel_source_commit" >&2; cat "$f" >&2; exit 1; }
          done
          ARGS=()
          for f in "${FILES[@]}"; do ARGS+=(--pins "$f"); done
          python3 -I .github/scripts/device_evidence.py validate \
            "${ARGS[@]}" --data "$DEVICE_VALIDATION" --output device-validation-metadata.json
          cat device-validation-metadata.json
          echo "RUN=$RUN" >> "$GITHUB_ENV"

      - name: Merge into known-good.json and commit
        run: |
          set -euo pipefail
          KG=.github/known-good.json
          [ -f "$KG" ] || echo '{}' > "$KG"
          NEW="$(jq -s 'reduce .[] as $x ({}; . + $x)' pins/*/known-good-candidate.json)"
          jq -S --argjson new "$NEW" --argjson validations "$(cat device-validation-metadata.json)" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            reduce ($new | to_entries[]) as $e (.;
              (if has($e.key) and (.[$e.key].root_commit != $e.value.root_commit
                                   or .[$e.key].kernel_source_commit != $e.value.kernel_source_commit
                                   or .[$e.key].susfs_commit != $e.value.susfs_commit)
               then .[$e.key + "@previous"] = .[$e.key] else . end)
              | .[$e.key] = ($e.value + {marked_at: $at,
                  device_validation: $validations[$e.value.file]}))' "$KG" > "$KG.tmp"
          mv "$KG.tmp" "$KG"
          cat "$KG"
          if git diff --quiet -- "$KG"; then
            echo "known-good.json unchanged (this run is already the known-good set)."
            exit 0
          fi
          KEYS="$(echo "$NEW" | jq -r 'keys | join(", ")')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KG"
          git commit -m "known-good: ${KEYS} from run ${RUN}"
          git push
          {
            echo "### Marked known-good"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN}"
            echo "- sets: ${KEYS}"
          } >> "$GITHUB_STEP_SUMMARY"
