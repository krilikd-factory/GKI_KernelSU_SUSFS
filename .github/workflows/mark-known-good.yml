name: Mark build as known-good

# Run this AFTER you personally booted a stable build. The simple mode needs
# only the Build Kernels run URL and records boot_attested_only. Optionally paste
# a completed device checklist for the broader attested_passed scope.
# Candidate builds and build-only success are deliberately not enough.
# It copies that run's component pins (the *-Pins artifact every successful
# build leg uploads: KernelSU-Next, SUSFS, kernel/common, NoMount, BBG,
# DroidSpaces, kernel_patches, AnyKernel3 commits) into
# .github/known-good.json. "Build Kernels" with commit_mode=known-good
# (the default) then rebuilds exactly those commits. The set it replaces is
# kept as "<key>@previous" so a bad mark can be rolled back by hand.

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Paste the Build Kernels run URL whose kernel you personally BOOTED"
        required: true
        type: string
      build:
        description: "Optional: one build name; empty = every build in the run"
        required: false
        type: string
        default: ""
      device_validation:
        description: "Optional full checklist JSON; leave empty for boot-only confirmation"
        required: false
        type: string
        default: ""

concurrency:
  group: known-good
  cancel-in-progress: false

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the run's component pins
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE_VALIDATION: ${{ inputs.device_validation }}
          RUN_IN: ${{ inputs.run_id }}
          BUILD_IN: ${{ inputs.build }}
        run: |
          set -euo pipefail
          RUN="${RUN_IN##*/runs/}"; RUN="${RUN%%/*}"; RUN="${RUN%%\?*}"
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo "ERROR: '$RUN_IN' is not a run id or run URL" >&2; exit 1; }
          CONCL="$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json conclusion,workflowName --jq '.workflowName + " / " + (.conclusion // "in progress")')"
          echo "Run $RUN: $CONCL"
          [[ "$CONCL" == *" / success" ]] || { echo "ERROR: only a successful build run can become known-good" >&2; exit 1; }
          PATTERN="*-Pins"
          [ -n "$BUILD_IN" ] && PATTERN="${BUILD_IN}-Pins"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir pins
          shopt -s nullglob
          FILES=(pins/*/known-good-candidate.json)
          [ "${#FILES[@]}" -gt 0 ] || { echo "ERROR: run $RUN has no '$PATTERN' artifact (built before pin recording existed, or expired)" >&2; exit 1; }
          printf 'pins: %s\n' "${FILES[@]}"
          # A build that applied candidate patches is intentionally not
          # promotable: enable the reviewed patches in patch-policy.json, make
          # a stable rebuild, then validate that exact artifact on the device.
          # A candidate-channel build that applied NO candidate patch has the
          # same sources as a stable one, so it is accepted.
          for f in "${FILES[@]}"; do
            jq -e 'to_entries[0].value
                   | (.patch_channel == "stable" or ((.candidate_patches_applied // -1) == 0))' "$f" >/dev/null \
              || { echo "::error::$(basename "$(dirname "$f")"): built with patch_channel=candidate (candidate patches applied: $(jq -r 'to_entries[0].value.candidate_patches_applied // "not recorded by that build"' "$f")). Only a stable build, or a candidate build that applied no candidate patch, can become known-good. Use the run URL of a patch_channel=stable build of the same commits." >&2; exit 1; }
            jq -e 'to_entries[0].value
                   | (.patch_inventory_sha256|test("^[0-9a-f]{64}$"))
                   and (.source_provenance_sha256|test("^[0-9a-f]{64}$"))
                   and (.capabilities_sha256|test("^[0-9a-f]{64}$"))' "$f" >/dev/null \
              || { echo "::error::$f lacks build evidence (patch inventory / source provenance / capabilities digests); it was built by an older workflow. Rebuild, then mark that run." >&2; exit 1; }
          done
          # Every recorded set must carry real commits for the parts that decide
          # whether it boots; refuse to mark a half-empty set as known-good.
          for f in "${FILES[@]}"; do
            jq -e 'to_entries[0].value
                   | (.root_commit|test("^[0-9a-f]{40}$"))
                     and (.kernel_source_commit|test("^[0-9a-f]{40}$"))' "$f" >/dev/null \
              || { echo "ERROR: $f lacks root_commit/kernel_source_commit" >&2; cat "$f" >&2; exit 1; }
          done
          ARGS=()
          for f in "${FILES[@]}"; do ARGS+=(--pins "$f"); done
          if [ -n "${DEVICE_VALIDATION//[[:space:]]/}" ]; then
            python3 -I .github/scripts/device_evidence.py validate \
              "${ARGS[@]}" --data "$DEVICE_VALIDATION" --output device-validation-metadata.json
          else
            # Manual dispatch is the owner's explicit boot attestation. It does
            # not claim the rest of the physical device checklist was run.
            python3 -I .github/scripts/device_evidence.py validate \
              "${ARGS[@]}" --boot-confirmed --confirmed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --output device-validation-metadata.json
            echo "::notice::URL-only mode: recording boot_attested_only; the full device checklist was not attested."
          fi
          cat device-validation-metadata.json
          echo "RUN=$RUN" >> "$GITHUB_ENV"

      - name: Merge into known-good.json and commit
        run: |
          set -euo pipefail
          KG=.github/known-good.json
          [ -f "$KG" ] || echo '{}' > "$KG"
          NEW="$(jq -s 'reduce .[] as $x ({}; . + $x)' pins/*/known-good-candidate.json)"
          jq -S --argjson new "$NEW" --argjson validations "$(cat device-validation-metadata.json)" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            reduce ($new | to_entries[]) as $e (.;
              (if has($e.key) and (.[$e.key].root_commit != $e.value.root_commit
                                   or .[$e.key].kernel_source_commit != $e.value.kernel_source_commit
                                   or .[$e.key].susfs_commit != $e.value.susfs_commit)
               then .[$e.key + "@previous"] = .[$e.key] else . end)
              | .[$e.key] = ($e.value + {marked_at: $at,
                  device_validation: $validations[$e.value.file]}))' "$KG" > "$KG.tmp"
          mv "$KG.tmp" "$KG"
          cat "$KG"
          if git diff --quiet -- "$KG"; then
            echo "known-good.json unchanged (this run is already the known-good set)."
            exit 0
          fi
          KEYS="$(echo "$NEW" | jq -r 'keys | join(", ")')"
          EVIDENCE_STATE="$(jq -r '[.[].status] | unique | join(", ")' device-validation-metadata.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KG"
          git commit -m "known-good: ${KEYS} from run ${RUN}"
          git push
          {
            echo "### Marked known-good"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN}"
            echo "- sets: ${KEYS}"
            echo "- device evidence: ${EVIDENCE_STATE}"
            if [ "$EVIDENCE_STATE" = "boot_attested_only" ]; then
              echo "- scope: manual boot confirmation only; other device checks were not attested"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
