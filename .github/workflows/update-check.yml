name: KRILIKD Update Check

# What is newer than the kernel that booted? Compares every component of the
# known-good set (.github/known-good.json) with its upstream tip and lists the
# new commits: KernelSU-Next, SUSFS, NoMount, Baseband-guard, DroidSpaces,
# kernel_patches, AnyKernel3, USB-Arsenal, VPN Hide releases, the kernel
# source itself, plus OnePlus source availability and upstream workflow news.
# The daily scheduled run starts a commit_mode=latest candidate by itself when
# something is newer (once per set of updates); a manual run does so only with
# build_latest ticked. Proven companion-only diffs dispatch release_type=Modules;
# kernel, mixed, unknown or unreachable evidence still requires a full build.

on:
  workflow_dispatch:
    inputs:
      known_good_key:
        description: "Known-good set to compare (empty = all)"
        required: false
        type: string
        default: ""
      build_latest:
        description: "If anything is newer, start Build Kernels with commit_mode=latest"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: update-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Compare known-good with upstream
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python3 -I .github/scripts/update_check.py \
            --repo-root . \
            --key "${{ inputs.known_good_key }}" \
            --report update-report.md \
            --json update-summary.json
          cat update-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "updates=$(jq -r .updates update-summary.json)" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(jq -r .fingerprint update-summary.json)" >> "$GITHUB_OUTPUT"
          echo "build_inputs=$(jq -c '.build_inputs // {}' update-summary.json)" >> "$GITHUB_OUTPUT"
          echo "update_action=$(jq -r '.update_plan.action // "full_build"' update-summary.json)" >> "$GITHUB_OUTPUT"
          echo "modules_only=$(jq -r 'if .update_plan.action == "modules_only" then "true" else "false" end' update-summary.json)" >> "$GITHUB_OUTPUT"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: update-report
          path: |
            update-report.md
            update-summary.json

      # A scheduled run starts the latest build by itself, once per distinct
      # set of upstream updates AND known-good features: the fingerprint marks
      # "a candidate for exactly these updates and this scheduler composition
      # was already built". So there is always a fresh candidate kernel waiting,
      # and no rebuild loop while you have not marked it known-good yet.
      - name: Was a candidate for these updates already built?
        id: seen
        if: steps.check.outputs.updates != '0'
        uses: actions/cache/restore@v6
        with:
          path: update-summary.json
          key: latest-candidate-${{ steps.check.outputs.fingerprint }}
          lookup-only: true

      - name: Start latest candidate or changed module artifacts
        id: start
        if: >-
          steps.check.outputs.updates != '0' &&
          (inputs.build_latest || (github.event_name == 'schedule' && steps.seen.outputs.cache-hit != 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_INPUTS: ${{ steps.check.outputs.build_inputs }}
          MODULES_ONLY: ${{ steps.check.outputs.modules_only }}
        shell: bash
        run: |
          set -euo pipefail
          # Never drop the boot-attested feature composition back to main.yml
          # defaults. In particular Perf+BORE must arrive as use_perf=bore.
          jq -e 'type == "object" and all(to_entries[]; (.key | type == "string") and (.value | type == "string"))' \
            <<< "$BUILD_INPUTS" > /dev/null
          build_args=()
          while IFS=$'\t' read -r name value; do
            [ -n "$name" ] && [ -n "$value" ] || { echo "::error::Empty inherited build input" >&2; exit 2; }
            build_args+=("-f" "$name=$value")
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "$BUILD_INPUTS")
          case "$MODULES_ONLY" in
            true|false) ;;
            *) echo "::error::Invalid modules_only gate: $MODULES_ONLY" >&2; exit 2 ;;
          esac
          if [ "$MODULES_ONLY" = true ]; then
            build_args+=("-f" "release_type=Modules")
          else
            build_args+=("-f" "release_type=CI")
          fi
          gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" \
            -f commit_mode=latest "${build_args[@]}"
          if [ "$MODULES_ONLY" = true ]; then
            echo "Started only the changed companion module artifact jobs for update set ${{ steps.check.outputs.fingerprint }}; all kernel image and release jobs are gated off." >> "$GITHUB_STEP_SUMMARY"
          else
            USE_PERF_SENT="$(jq -r '.use_perf // "true"' <<< "$BUILD_INPUTS")"
            echo "Started a full Build Kernels candidate (commit_mode=latest, use_perf=${USE_PERF_SENT}) for update set ${{ steps.check.outputs.fingerprint }}. The known-good feature_set remains boot-attested and unchanged; this BORE candidate still needs a separate boot check before promotion." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remember that this update set has a candidate
        if: steps.start.outcome == 'success' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: update-summary.json
          key: latest-candidate-${{ steps.check.outputs.fingerprint }}
