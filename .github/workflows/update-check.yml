name: KRILIKD Update Check

# What is newer than the kernel that booted? Compares every component of the
# known-good set (.github/known-good.json) with its upstream tip and lists the
# new commits: KernelSU-Next, SUSFS, NoMount, Baseband-guard, DroidSpaces,
# kernel_patches, AnyKernel3, USB-Arsenal, VPN Hide releases, the kernel
# source itself, plus OnePlus source availability and upstream workflow news.
# The hourly scheduled run starts a commit_mode=latest candidate by itself when
# something is newer (once per set of updates); a manual run does so only with
# build_latest ticked. Proven companion-only diffs dispatch release_type=Modules;
# kernel, mixed, unknown or unreachable evidence still requires a full build.

on:
  workflow_dispatch:
    inputs:
      known_good_key:
        description: "Known-good set to compare (empty = all)"
        required: false
        type: string
        default: ""
      build_latest:
        description: "If anything is newer, start Build Kernels with commit_mode=latest"
        type: boolean
        default: false
      as_schedule:
        description: "Behave as the scheduled run (an external timer: build once per update set)"
        type: boolean
        default: false
  schedule:
    - cron: "23,53 * * * *"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: update-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Compare known-good with upstream
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python3 -I .github/scripts/update_check.py \
            --repo-root . \
            --key "${{ inputs.known_good_key }}" \
            --report update-report.md \
            --json update-summary.json
          cat update-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "updates=$(jq -r .updates update-summary.json)" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(jq -r .fingerprint update-summary.json)" >> "$GITHUB_OUTPUT"
          echo "build_inputs=$(jq -c '.build_inputs // {}' update-summary.json)" >> "$GITHUB_OUTPUT"
          echo "update_action=$(jq -r '.update_plan.action // "full_build"' update-summary.json)" >> "$GITHUB_OUTPUT"
          echo "modules_only=$(jq -r 'if .update_plan.action == "modules_only" then "true" else "false" end' update-summary.json)" >> "$GITHUB_OUTPUT"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: update-report
          path: |
            update-report.md
            update-summary.json

      # A scheduled run starts the latest build by itself, once per distinct
      # set of upstream updates AND known-good features: the fingerprint marks
      # "a candidate for exactly these updates and this scheduler composition
      # was already built". So there is always a fresh candidate kernel waiting,
      # and no rebuild loop while you have not marked it known-good yet.
      - name: Was a candidate for these updates already built?
        id: seen
        if: steps.check.outputs.updates != '0'
        uses: actions/cache/restore@v6
        with:
          path: update-summary.json
          key: latest-candidate-${{ steps.check.outputs.fingerprint }}
          lookup-only: true

      - name: Start latest candidate or changed module artifacts
        id: start
        if: >-
          steps.check.outputs.updates != '0' &&
          (inputs.build_latest || ((github.event_name == 'schedule' || inputs.as_schedule) && steps.seen.outputs.cache-hit != 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_INPUTS: ${{ steps.check.outputs.build_inputs }}
          MODULES_ONLY: ${{ steps.check.outputs.modules_only }}
        shell: bash
        run: |
          set -euo pipefail
          # Never drop the boot-attested feature composition back to main.yml
          # defaults. In particular Perf+BORE must arrive as use_perf=bore.
          jq -e 'type == "object" and all(to_entries[]; (.key | type == "string") and (.value | type == "string"))' \
            <<< "$BUILD_INPUTS" > /dev/null
          build_args=()
          while IFS=$'\t' read -r name value; do
            [ -n "$name" ] && [ -n "$value" ] || { echo "::error::Empty inherited build input" >&2; exit 2; }
            build_args+=("-f" "$name=$value")
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "$BUILD_INPUTS")
          case "$MODULES_ONLY" in
            true|false) ;;
            *) echo "::error::Invalid modules_only gate: $MODULES_ONLY" >&2; exit 2 ;;
          esac
          if [ "$MODULES_ONLY" = true ]; then
            build_args+=("-f" "release_type=Modules")
          else
            build_args+=("-f" "release_type=CI")
          fi
          gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" \
            -f commit_mode=latest "${build_args[@]}"
          if [ "$MODULES_ONLY" = true ]; then
            echo "Started only the changed companion module artifact jobs for update set ${{ steps.check.outputs.fingerprint }}; all kernel image and release jobs are gated off." >> "$GITHUB_STEP_SUMMARY"
          else
            USE_PERF_SENT="$(jq -r '.use_perf // "true"' <<< "$BUILD_INPUTS")"
            echo "Started a full Build Kernels candidate (commit_mode=latest, use_perf=${USE_PERF_SENT}) for update set ${{ steps.check.outputs.fingerprint }}. The known-good feature_set remains boot-attested and unchanged; this BORE candidate still needs a separate boot check before promotion." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remember that this update set has a candidate
        if: steps.start.outcome == 'success' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: update-summary.json
          key: latest-candidate-${{ steps.check.outputs.fingerprint }}

      # OnePlus published kernel source the phone's firmware can use: start one
      # kernel_source=oneplus candidate per OnePlus tip, with the same inherited
      # feature composition, so the switch from AOSP to OnePlus source never
      # waits for someone to read a report.
      - name: Was a OnePlus-source candidate already built for this tip?
        id: opseen
        if: github.event_name == 'schedule' || inputs.as_schedule || inputs.build_latest
        shell: bash
        run: |
          set -euo pipefail
          echo "ready=$(jq -r '.oneplus.ready // false' update-summary.json)" >> "$GITHUB_OUTPUT"
          echo "tip=$(jq -r '.oneplus.tip // ""' update-summary.json)" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.oneplus.branch // ""' update-summary.json)" >> "$GITHUB_OUTPUT"

      - name: OnePlus candidate cache lookup
        id: opcache
        if: steps.opseen.outputs.ready == 'true' && steps.opseen.outputs.tip != ''
        uses: actions/cache/restore@v6
        with:
          path: update-summary.json
          key: oneplus-candidate-${{ steps.opseen.outputs.tip }}
          lookup-only: true

      - name: Start a OnePlus-source candidate
        id: opstart
        if: steps.opseen.outputs.ready == 'true' && steps.opseen.outputs.tip != '' && steps.opcache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_INPUTS: ${{ steps.check.outputs.build_inputs }}
          OP_BRANCH: ${{ steps.opseen.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          build_args=()
          while IFS=$'\t' read -r name value; do
            [ -n "$name" ] && [ -n "$value" ] || continue
            case "$name" in kernel_source|oneplus_branch|release_type|kernel_build_version|commit_mode) continue ;; esac
            build_args+=("-f" "$name=$value")
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "${BUILD_INPUTS:-{\}}")
          gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" \
            -f commit_mode=latest -f release_type=CI -f kernel_source=oneplus \
            -f kernel_build_version=6.12.x-android16 -f oneplus_branch="$OP_BRANCH" "${build_args[@]}"
          echo "Started a kernel_source=oneplus candidate from \`$OP_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Remember the OnePlus candidate
        if: steps.opstart.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: update-summary.json
          key: oneplus-candidate-${{ steps.opseen.outputs.tip }}

      # Everything waiting for a decision - newer components, OnePlus source,
      # unreviewed kernel_patches - goes into one issue, so GitHub notifies the
      # owner instead of the list living only in a run summary.
      - name: Upstream review queue issue
        if: always() && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python3 -I .github/scripts/review_queue.py update-summary.json body.md)"
          STATE="$(sed -n 's/^state=//p' <<< "$OUT")"
          SIG="$(sed -n 's/^signature=//p' <<< "$OUT")"
          printf '\nReport: %s\n' "$RUN_URL" >> body.md
          TITLE="Upstream review queue: updates, OnePlus source, patches to review"
          ghr() {
            local i
            for i in 1 2 3 4; do
              if "$@"; then return 0; fi
              sleep $((i * 15))
            done
            echo "::warning::GitHub API kept failing for: $*. The report is in this run's summary; the next run retries."
            cat body.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            exit 0
          }
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)" != true ]; then
            echo "::warning::Issues are disabled in this repository, so the owner is not notified. Enable them in Settings -> General -> Features -> Issues."
            cat body.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create review-queue --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "Upstream changes waiting for a decision" >/dev/null 2>&1 || true
          ghr gh issue list --repo "$GITHUB_REPOSITORY" --label review-queue --state open --json number --jq '.[0].number // empty' > issue_num.txt
          NUM="$(cat issue_num.txt)"
          if [ "$STATE" = close ]; then
            if [ -n "$NUM" ]; then
              ghr gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "Nothing is waiting any more ($RUN_URL). Closing."
              ghr gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          if [ -z "$NUM" ]; then
            ghr gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label review-queue --body-file body.md
          else
            OLD="$(ghr gh issue view "$NUM" --repo "$GITHUB_REPOSITORY" --json body --jq .body | sed -n 's/.*review-queue-signature:\([0-9a-f]*\).*/\1/p' | head -n1)"
            ghr gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body-file body.md
            [ "$OLD" = "$SIG" ] || ghr gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file body.md
          fi
