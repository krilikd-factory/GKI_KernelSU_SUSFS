name: KRILIKD Patch Update Audit

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream kernel_patches ref (branch, tag or commit)"
        required: true
        type: string
        default: main
      prepare_bundle:
        description: "Upload a review bundle with upstream patches (never applies them)"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: krilikd-patch-audit
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/WildKernels/kernel_patches.git
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}

jobs:
  audit:
    name: Audit upstream patch set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout KRILIKD repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate audit helper
        shell: bash
        run: python3 -m py_compile .github/scripts/upstream_patch_audit.py

      - name: Fetch upstream patch repository
        shell: bash
        env:
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_REF: ${{ env.UPSTREAM_REF }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/kernel_patches"
          [[ "$UPSTREAM_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid upstream_ref" >&2; exit 2; }
          git clone --filter=blob:none --no-checkout --depth=1 "$UPSTREAM_REPO" "$RUNNER_TEMP/kernel_patches"
          git -C "$RUNNER_TEMP/kernel_patches" fetch --depth=1 origin -- "$UPSTREAM_REF"
          git -C "$RUNNER_TEMP/kernel_patches" checkout --force FETCH_HEAD
          printf 'upstream_commit=%s\n' "$(git -C "$RUNNER_TEMP/kernel_patches" rev-parse HEAD)" > "$RUNNER_TEMP/patch-audit-metadata.txt"
          printf 'upstream_repo=%s\n' "$UPSTREAM_REPO" >> "$RUNNER_TEMP/patch-audit-metadata.txt"
          printf 'upstream_ref=%s\n' "$UPSTREAM_REF" >> "$RUNNER_TEMP/patch-audit-metadata.txt"
          git -C "$RUNNER_TEMP/kernel_patches" log -1 --format='upstream_subject=%s' >> "$RUNNER_TEMP/patch-audit-metadata.txt"
          cat "$RUNNER_TEMP/patch-audit-metadata.txt"

      - name: Build audit report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/krilikd-patch-audit"
          python3 .github/scripts/upstream_patch_audit.py \
            --local-root .github/actions \
            --upstream-root "$RUNNER_TEMP/kernel_patches" \
            --metadata <(python3 - "$RUNNER_TEMP/patch-audit-metadata.txt" <<'PY'
          import json, sys
          metadata = {}
          for line in open(sys.argv[1], encoding='utf-8'):
              key, value = line.rstrip('\n').split('=', 1)
              metadata[key] = value
          print(json.dumps(metadata))
          PY
            --output "$RUNNER_TEMP/krilikd-patch-audit/upstream-patch-audit.md" \
            --json-output "$RUNNER_TEMP/krilikd-patch-audit/upstream-patch-audit.json" \
            > "$RUNNER_TEMP/krilikd-patch-audit/console.log"
          cp "$RUNNER_TEMP/patch-audit-metadata.txt" "$RUNNER_TEMP/krilikd-patch-audit/"
          cat "$RUNNER_TEMP/krilikd-patch-audit/upstream-patch-audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Run static safety scan on upstream patch files
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/krilikd-patch-audit/safety-scan.txt"
          : > "$report"
          while IFS= read -r -d '' patch_file; do
            if grep -nEiq 'thermal|trip[_ -]?temp|undervolt|overvolt|voltage|smp_affinity|sched[_ -]?util|commit[_ -]?age|dirty[_ -]?ratio' "$patch_file"; then
              printf 'REVIEW_REQUIRED %s\n' "$patch_file" >> "$report"
            fi
          done < <(find "$RUNNER_TEMP/kernel_patches" -type f \( -name '*.patch' -o -name '*.diff' \) -print0 | sort -z)
          if [ ! -s "$report" ]; then echo 'No high-risk marker found by the conservative scan.' > "$report"; fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload read-only audit and review bundle
        if: github.event_name == 'schedule' || inputs.prepare_bundle
        uses: actions/upload-artifact@v7
        with:
          name: krilikd-upstream-patch-audit-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/krilikd-patch-audit/
            ${{ runner.temp }}/kernel_patches/**/*.patch
            ${{ runner.temp }}/kernel_patches/**/*.diff
          if-no-files-found: warn
          retention-days: 30
